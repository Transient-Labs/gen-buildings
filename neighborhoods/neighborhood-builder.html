<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neighborhood Builder</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            height: 100vh;
        }
        #panel {
            width: 380px;
            flex-shrink: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid #333;
            overflow-y: auto;
        }
        h1 { font-size: 18px; margin: 0; }
        p.hint { margin: 0; color: #999; font-size: 12px; }
        label { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; }
        textarea, input {
            width: 100%;
            background: #1c1c1c;
            color: #eee;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            font: 12px/1.4 ui-monospace, Menlo, monospace;
        }
        textarea { flex: 1; min-height: 240px; resize: vertical; }
        .row { display: flex; gap: 8px; }
        button {
            flex: 1;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            background: #333;
            color: #eee;
        }
        button.primary { background: #e8e8e8; color: #111; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #status { font-size: 12px; white-space: pre-wrap; }
        .ok { color: #6c6; }
        .warn { color: #db5; }
        .err { color: #e66; }
        #preview { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        #preview iframe { width: 100%; height: 100%; border: 0; }
        #preview .empty { color: #555; }
    </style>
</head>

<body>
    <div id="panel">
        <h1>Neighborhood Builder</h1>
        <p class="hint">Paste the window picks (exactly 320 numbers from 1 to 1000, in grid order: left to right, top to bottom). Brackets, commas, spaces, or new lines all work.</p>

        <label for="picks">Picks</label>
        <textarea id="picks" spellcheck="false" placeholder="[513, 271, 114, ...]"></textarea>

        <label for="name">File name</label>
        <input id="name" value="neighborhood.html" spellcheck="false" />

        <div id="status"></div>

        <div class="row">
            <button id="previewBtn">Preview</button>
            <button id="saveBtn" class="primary">Save HTML</button>
        </div>
    </div>

    <div id="preview"><span class="empty">Preview shows here</span></div>

    <!-- The artwork template. Do not edit; __PICKS__ is replaced with the picks array. -->
    <textarea id="template" hidden>&lt;!doctype html&gt;
&lt;html lang="en"&gt;

&lt;head&gt;
    &lt;meta charset="utf-8" /&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1" /&gt;
    &lt;title&gt;Neighborhood&lt;/title&gt;
    &lt;style&gt;
        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
    &lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;
    &lt;script&gt;
        const WINDOW_COUNT = 1000;

        const COLS = 20;
        const ROWS = 16;
        const CELL_W = 200;
        const CELL_H = 250;
        const LIVE_MAX_H = 4000;

        const hasMouse = !!(window.matchMedia &amp;&amp; window.matchMedia("(any-pointer: fine)").matches);
        const liveScale = hasMouse ? 1 : Math.min(1, LIVE_MAX_H / (ROWS * CELL_H));
        const cellW = Math.round(CELL_W * liveScale);
        const cellH = Math.round(CELL_H * liveScale);
        const W = COLS * cellW;
        const H = ROWS * cellH;


        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        const IPFS_GATEWAYS = [
            "https://ipfs.transientusercontent.xyz",
            "https://ipfs.io",
            "https://dweb.link",
            "https://ipfs.filebase.io",
        ];

        function loadFrom(src) {
            return new Promise((resolve, reject) =&gt; {
                const img = new Image();
                img.onload = () =&gt; resolve(img);
                img.onerror = () =&gt; reject(new Error("failed to load " + src));
                img.src = src;
            }).then((img) =&gt;
                img
                    .decode()
                    .then(() =&gt; (window.createImageBitmap ? createImageBitmap(img) : img))
                    .catch(() =&gt; img)
            );
        }

        function loadImage(src) {
            const path = src.slice(src.indexOf("/ipfs/"));
            let attempt = 0;
            const tryNext = () =&gt;
                loadFrom(IPFS_GATEWAYS[attempt] + path).catch((err) =&gt; {
                    if (++attempt &lt; IPFS_GATEWAYS.length) return tryNext();
                    throw err;
                });
            return tryNext();
        }

        const FPS = 60;
        const TOTAL_FRAMES = 2 * FPS;
        const POP_FRAMES = 36;

        function easeOutBack(t) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        const picks = __PICKS__;
        const cells = COLS * ROWS;

        function det(i, k) {
            const x = Math.sin((i + 1) * 127.1 + (k + 1) * 311.7) * 43758.5453;
            return x - Math.floor(x);
        }

        const revealOrder = picks.map((_, i) =&gt; i).sort((a, b) =&gt; det(a, 99) - det(b, 99));

        const floats = picks.map((_, i) =&gt; ({
            ax: 0.01 + 0.012 * det(i, 0),
            ay: 0.014 + 0.016 * det(i, 1),
            sx: 0.008 + 0.012 * det(i, 2),
            sy: 0.008 + 0.012 * det(i, 3),
            px: 2 * Math.PI * det(i, 4),
            py: 2 * Math.PI * det(i, 5),
            as: 0.02 + 0.03 * det(i, 6),
            ss: 0.006 + 0.01 * det(i, 7),
            ps: 2 * Math.PI * det(i, 8),
        }));

            Promise.all(picks.map((n) =&gt; loadImage(`https://ipfs.io/ipfs/Qmb195Z9XLptpKy3oyUxeLupCQE9eDUrXkiz8xQuSK1GwV/window-${n}.webp`))).then((images) =&gt; {
                const count = COLS * ROWS;

                const span = TOTAL_FRAMES - POP_FRAMES;
                const startFrame = new Array(count);
                revealOrder.forEach((cell, order) =&gt; {
                    startFrame[cell] = count &gt; 1 ? Math.round((order / (count - 1)) * span) : 0;
                });

                function render(frame) {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(0, 0, W, H);

                    for (let gy = 0; gy &lt; ROWS; gy++) {
                        for (let gx = 0; gx &lt; COLS; gx++) {
                            const i = gy * COLS + gx;
                            const t = (frame - startFrame[i]) / POP_FRAMES;
                            if (t &lt; 0) continue;

                            const scale = t &gt;= 1 ? 1 : easeOutBack(t);
                            if (scale &lt;= 0) continue;

                            const x = gx * cellW;
                            const y = gy * cellH;
                            const cx = x + cellW / 2;
                            const cy = y + cellH / 2;
                            ctx.drawImage(
                                images[i],
                                cx - (cellW * scale) / 2,
                                cy - (cellH * scale) / 2,
                                cellW * scale,
                                cellH * scale
                            );
                        }
                    }
                }

                function renderFloat(f, k) {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(0, 0, W, H);

                    for (let gy = 0; gy &lt; ROWS; gy++) {
                        for (let gx = 0; gx &lt; COLS; gx++) {
                            const i = gy * COLS + gx;
                            const fl = floats[i];
                            const x = gx * cellW;
                            const y = gy * cellH;
                            const offX = fl.ax * cellW * Math.sin(f * fl.sx + fl.px) * k;
                            const offY = fl.ay * cellH * Math.sin(f * fl.sy + fl.py) * k;
                            const swell = 1 + fl.as * Math.sin(f * fl.ss + fl.ps) * k;
                            const w = cellW * swell;
                            const h = cellH * swell;
                            ctx.drawImage(
                                images[i],
                                x + offX + (cellW - w) / 2,
                                y + offY + (cellH - h) / 2,
                                w,
                                h
                            );
                        }
                    }
                }

                function scaleAtFrame(rf, i) {
                    const t = (rf - startFrame[i]) / POP_FRAMES;
                    if (t &lt; 0) return 0;
                    return t &gt;= 1 ? 1 : easeOutBack(t);
                }

                const SNAP_FRAMES = 24;
                let snapScales = null;
                function renderSnap(t) {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(0, 0, W, H);

                    const eased = t &gt;= 1 ? 1 : easeOutBack(t);
                    for (let gy = 0; gy &lt; ROWS; gy++) {
                        for (let gx = 0; gx &lt; COLS; gx++) {
                            const i = gy * COLS + gx;
                            const scale = snapScales[i] + (1 - snapScales[i]) * eased;
                            if (scale &lt;= 0) continue;
                            const x = gx * cellW;
                            const y = gy * cellH;
                            const cx = x + cellW / 2;
                            const cy = y + cellH / 2;
                            ctx.drawImage(
                                images[i],
                                cx - (cellW * scale) / 2,
                                cy - (cellH * scale) / 2,
                                cellW * scale,
                                cellH * scale
                            );
                        }
                    }
                }

                let state = "reveal";
                let frame = 0;
                let floatFrame = 0;
                let calmStartK = 1;
                const PAUSE_FRAMES = 30;
                const RAMP_FRAMES = 60;

                const ZOOM_FRAMES = 72;
                let baseState = "settled";

                function easeInOutCubic(t) {
                    return t &lt; 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                function renderBase() {
                    if (baseState === "alive") {
                        renderFloat(floatFrame, Math.min(floatFrame / RAMP_FRAMES, 1));
                        floatFrame++;
                    } else {
                        render(TOTAL_FRAMES);
                    }
                }

                const ZOOM_LEVEL = 0.5;
                const GRID_VIEW = { x: W / 2, y: H / 2, vw: W };
                let cam = { ...GRID_VIEW };
                let zoomTarget = null;
                let zoomFrom = null;

                let vel = { x: 0, y: 0 };
                const FRICTION = 0.9;
                const MIN_VEL = 0.2;

                function renderView(c) {
                    const s = W / c.vw;
                    ctx.setTransform(s, 0, 0, s, W / 2 - c.x * s, H / 2 - c.y * s);
                    renderBase();
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                }

                function renderZoomLeg(from, to, u) {
                    const e = easeInOutCubic(u);
                    cam = {
                        x: from.x + (to.x - from.x) * e,
                        y: from.y + (to.y - from.y) * e,
                        vw: from.vw + (to.vw - from.vw) * e,
                    };
                    renderView(cam);
                }

                function clampAxis(v, half, max) {
                    if (half * 2 &gt;= max) return max / 2;
                    return Math.min(Math.max(v, half), max - half);
                }
                function clampCam() {
                    const vh = cam.vw * (H / W);
                    cam.x = clampAxis(cam.x, cam.vw / 2, W);
                    cam.y = clampAxis(cam.y, vh / 2, H);
                }

                function tick() {
                    if (state === "reveal") {
                        render(frame);
                        if (frame &gt;= TOTAL_FRAMES) {
                            state = "settled";
                            running = false;
                            return;
                        }
                        frame++;
                    } else if (state === "out") {
                        render(TOTAL_FRAMES - frame);
                        if (frame &gt;= TOTAL_FRAMES) {
                            state = "pause";
                            frame = 0;
                        } else {
                            frame++;
                        }
                    } else if (state === "pause") {
                        render(-1);
                        if (frame &gt;= PAUSE_FRAMES) {
                            state = "in";
                            frame = 0;
                        } else {
                            frame++;
                        }
                    } else if (state === "in") {
                        render(frame);
                        if (frame &gt;= TOTAL_FRAMES) {
                            state = "hold";
                            frame = 0;
                        } else {
                            frame++;
                        }
                    } else if (state === "hold") {
                        render(TOTAL_FRAMES);
                        if (frame &gt;= PAUSE_FRAMES) {
                            state = "out";
                            frame = 0;
                        } else {
                            frame++;
                        }
                    } else if (state === "snap") {
                        renderSnap(frame / SNAP_FRAMES);
                        if (frame &gt;= SNAP_FRAMES) {
                            state = "alive";
                            floatFrame = 0;
                        } else {
                            frame++;
                        }
                    } else if (state === "alive") {
                        const k = Math.min(floatFrame / RAMP_FRAMES, 1);
                        renderFloat(floatFrame, k);
                        floatFrame++;
                    } else if (state === "calm") {
                        const k = calmStartK * Math.max(1 - frame / RAMP_FRAMES, 0);
                        renderFloat(floatFrame, k);
                        floatFrame++;
                        if (frame &gt;= RAMP_FRAMES) {
                            render(TOTAL_FRAMES);
                            state = "settled";
                            running = false;
                            return;
                        }
                        frame++;
                    } else if (state === "zoomin") {
                        renderZoomLeg(zoomFrom, zoomTarget, frame / ZOOM_FRAMES);
                        if (frame &gt;= ZOOM_FRAMES) {
                            state = "zoomed";
                        } else {
                            frame++;
                        }
                    } else if (state === "zoomed") {
                        if (!drag &amp;&amp; (Math.abs(vel.x) &gt; MIN_VEL || Math.abs(vel.y) &gt; MIN_VEL)) {
                            const wantX = cam.x + vel.x;
                            const wantY = cam.y + vel.y;
                            cam.x = wantX;
                            cam.y = wantY;
                            clampCam();
                            if (cam.x !== wantX) vel.x = 0;
                            if (cam.y !== wantY) vel.y = 0;
                            vel.x *= FRICTION;
                            vel.y *= FRICTION;
                        } else if (!drag) {
                            vel.x = 0;
                            vel.y = 0;
                        }
                        renderView(cam);
                    } else if (state === "zoomout") {
                        renderZoomLeg(zoomFrom, GRID_VIEW, frame / ZOOM_FRAMES);
                        if (frame &gt;= ZOOM_FRAMES) {
                            state = baseState;
                            if (state === "settled") {
                                render(TOTAL_FRAMES);
                                running = false;
                                return;
                            }
                        } else {
                            frame++;
                        }
                    }
                }

                const targetInterval = 1000 / FPS;
                const FRAME_EPSILON = 5;
                let running = false;
                let lastTargetFrameTime = 0;

                function loop(now) {
                    if (!running) return;
                    requestAnimationFrame(loop);
                    if (now - lastTargetFrameTime &gt;= targetInterval - FRAME_EPSILON) {
                        lastTargetFrameTime = Math.max(lastTargetFrameTime + targetInterval, now);
                        tick();
                    }
                }
                function startLoop() {
                    if (running) return;
                    running = true;
                    lastTargetFrameTime = 0;
                    requestAnimationFrame(loop);
                }
                startLoop();

                const LONG_PRESS_MS = 500;
                const MOVE_TOLERANCE = 10;
                let pressTimer = null;
                let longPressFired = false;
                let pressPos = null;

                function cellAt(clientX, clientY) {
                    const rect = canvas.getBoundingClientRect();
                    const px = (clientX - rect.left) * (W / rect.width);
                    const py = (clientY - rect.top) * (H / rect.height);
                    const gx = Math.floor(px / cellW);
                    const gy = Math.floor(py / cellH);
                    if (gx &lt; 0 || gx &gt;= COLS || gy &lt; 0 || gy &gt;= ROWS) return null;
                    return { x: gx * cellW, y: gy * cellH };
                }

                function cancelPress() {
                    clearTimeout(pressTimer);
                    pressPos = null;
                }

                let drag = null;
                let suppressClick = false;
                let lastMoveT = 0;
                let lastPointerType = "mouse";

                function endDrag() {
                    if (drag) {
                        if (drag.moved) suppressClick = true;
                        if (performance.now() - lastMoveT &gt; 80) {
                            vel.x = 0;
                            vel.y = 0;
                        }
                    }
                    drag = null;
                }

                canvas.addEventListener("pointerdown", (e) =&gt; {
                    longPressFired = false;
                    lastPointerType = e.pointerType || "mouse";
                    if (e.button !== 0) return;
                    if (state === "zoomed") {
                        vel.x = 0;
                        vel.y = 0;
                        drag = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y, moved: false };
                        lastMoveT = performance.now();
                        canvas.setPointerCapture(e.pointerId);
                        return;
                    }
                    if (state !== "settled" &amp;&amp; state !== "alive") return;
                    const cell = cellAt(e.clientX, e.clientY);
                    if (!cell) return;
                    pressPos = { x: e.clientX, y: e.clientY };
                    clearTimeout(pressTimer);
                    pressTimer = setTimeout(() =&gt; {
                        longPressFired = true;
                        baseState = state;
                        zoomFrom = { ...GRID_VIEW };
                        const tvw = cellW / ZOOM_LEVEL;
                        const tvh = tvw * (H / W);
                        zoomTarget = {
                            x: clampAxis(cell.x + cellW / 2, tvw / 2, W),
                            y: clampAxis(cell.y + cellH / 2, tvh / 2, H),
                            vw: tvw,
                        };
                        state = "zoomin";
                        frame = 0;
                        vel.x = 0;
                        vel.y = 0;
                        startLoop();
                    }, LONG_PRESS_MS);
                });
                canvas.addEventListener("pointermove", (e) =&gt; {
                    if (drag) {
                        const rect = canvas.getBoundingClientRect();
                        const worldPerPx = cam.vw / rect.width;
                        const dx = e.clientX - drag.x;
                        const dy = e.clientY - drag.y;
                        if (Math.hypot(dx, dy) &gt; MOVE_TOLERANCE) drag.moved = true;
                        const prevX = cam.x;
                        const prevY = cam.y;
                        cam.x = drag.camX - dx * worldPerPx;
                        cam.y = drag.camY - dy * worldPerPx;
                        clampCam();
                        vel.x = (cam.x - prevX) * 0.6 + vel.x * 0.4;
                        vel.y = (cam.y - prevY) * 0.6 + vel.y * 0.4;
                        lastMoveT = performance.now();
                        return;
                    }
                    if (!pressPos) return;
                    if (Math.hypot(e.clientX - pressPos.x, e.clientY - pressPos.y) &gt; MOVE_TOLERANCE) {
                        cancelPress();
                    }
                });
                canvas.addEventListener("pointerup", () =&gt; {
                    cancelPress();
                    endDrag();
                });
                canvas.addEventListener("pointercancel", () =&gt; {
                    cancelPress();
                    endDrag();
                });
                canvas.addEventListener("pointerleave", cancelPress);
                canvas.addEventListener("contextmenu", (e) =&gt; {
                    if (lastPointerType === "touch") e.preventDefault();
                });
                canvas.style.touchAction = "none";

                canvas.addEventListener(
                    "wheel",
                    (e) =&gt; {
                        if (state !== "zoomed") return;
                        e.preventDefault();
                        const rect = canvas.getBoundingClientRect();
                        const worldPerPx = cam.vw / rect.width;
                        cam.x += e.deltaX * worldPerPx;
                        cam.y += e.deltaY * worldPerPx;
                        clampCam();
                    },
                    { passive: false }
                );

                canvas.addEventListener("click", () =&gt; {
                    if (suppressClick) {
                        suppressClick = false;
                        return;
                    }
                    if (longPressFired) {
                        longPressFired = false;
                        return;
                    }
                    if (state === "zoomed" || state === "zoomin") {
                        zoomFrom = { ...cam };
                        state = "zoomout";
                        frame = 0;
                        return;
                    }
                    if (state === "settled") {
                        state = "out";
                        frame = 0;
                        startLoop();
                    } else if (state === "out" || state === "pause" || state === "in" || state === "hold") {
                        const rf =
                            state === "out" ? TOTAL_FRAMES - frame :
                                state === "pause" ? -1 :
                                    state === "in" ? frame :
                                        TOTAL_FRAMES;
                        snapScales = picks.map((_, i) =&gt; scaleAtFrame(rf, i));
                        state = "snap";
                        frame = 0;
                    } else if (state === "alive") {
                        calmStartK = Math.min(floatFrame / RAMP_FRAMES, 1);
                        state = "calm";
                        frame = 0;
                    }
                });
            });
    &lt;/script&gt;
&lt;/body&gt;

&lt;/html&gt;</textarea>

    <script>
        const CELLS = 320;
        const MAX = 1000;
        const template = document.getElementById("template").value;
        const picksEl = document.getElementById("picks");
        const nameEl = document.getElementById("name");
        const statusEl = document.getElementById("status");
        const previewBtn = document.getElementById("previewBtn");
        const saveBtn = document.getElementById("saveBtn");
        const previewEl = document.getElementById("preview");

        function parse() {
            const raw = picksEl.value;
            const errors = [];
            const warnings = [];
            const tokens = raw.split(/[\s,\[\]]+/).filter(Boolean);
            const picks = [];
            const bad = [];
            for (const t of tokens) {
                if (/^\d+$/.test(t)) picks.push(Number(t));
                else bad.push(t);
            }
            if (bad.length) errors.push(`Not whole numbers: ${bad.slice(0, 5).join(", ")}${bad.length > 5 ? ", ..." : ""}`);
            if (picks.length !== CELLS) errors.push(`Need exactly ${CELLS} picks, got ${picks.length}.`);
            const outOfRange = picks.filter((n) => n < 1 || n > MAX);
            if (outOfRange.length) errors.push(`Out of range (1-${MAX}): ${[...new Set(outOfRange)].slice(0, 5).join(", ")}${outOfRange.length > 5 ? ", ..." : ""}`);
            const seen = new Set();
            const dupes = new Set();
            for (const n of picks) (seen.has(n) ? dupes : seen).add(n);
            if (dupes.size) warnings.push(`Duplicates (allowed, but check): ${[...dupes].slice(0, 10).join(", ")}${dupes.size > 10 ? ", ..." : ""}`);
            return { picks, errors, warnings, empty: tokens.length === 0 };
        }

        function build(picks) {
            return template.replace("__PICKS__", "[" + picks.join(", ") + "]");
        }

        function update() {
            const { picks, errors, warnings, empty } = parse();
            const ok = !empty && errors.length === 0;
            previewBtn.disabled = !ok;
            saveBtn.disabled = !ok;
            if (empty) {
                statusEl.innerHTML = "";
                return;
            }
            const lines = [];
            for (const e of errors) lines.push(`<div class="err">✕ ${e}</div>`);
            for (const w of warnings) lines.push(`<div class="warn">! ${w}</div>`);
            if (ok) lines.push(`<div class="ok">✓ ${picks.length} picks ready</div>`);
            statusEl.innerHTML = lines.join("");
        }

        picksEl.addEventListener("input", update);

        previewBtn.addEventListener("click", () => {
            const { picks, errors } = parse();
            if (errors.length) return;
            const iframe = document.createElement("iframe");
            iframe.srcdoc = build(picks);
            previewEl.replaceChildren(iframe);
        });

        saveBtn.addEventListener("click", () => {
            const { picks, errors } = parse();
            if (errors.length) return;
            let name = nameEl.value.trim() || "neighborhood.html";
            if (!/\.html?$/i.test(name)) name += ".html";
            const blob = new Blob([build(picks)], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        });

        update();
    </script>
</body>

</html>
